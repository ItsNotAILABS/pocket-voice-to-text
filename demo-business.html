<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Business voice</title>
  <style>
    :root { --bg:#09090b; --panel:#141416; --line:rgba(255,255,255,.1); --fg:#fafafa; --muted:#a1a1aa; --accent:#10a37f; --red:#f87171; }
    body { margin:0; font-family:ui-sans-serif,system-ui,sans-serif; background:var(--bg); color:var(--fg); padding:24px; }
    .wrap { max-width:720px; margin:0 auto; }
    a { color:var(--accent); }
    .card { background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:20px; }
    select, button { font:inherit; padding:10px 12px; border-radius:10px; }
    button { background:var(--accent); color:#041; border:0; font-weight:700; cursor:pointer; }
    button.hot { background:var(--red); color:#fff; }
    #log { margin-top:14px; font-size:13px; line-height:1.5; max-height:300px; overflow:auto; }
  </style>
</head>
<body>
  <div class="wrap">
    <p><a href="index.html">← Stack</a> · <a href="terminal.html">⚡ Terminal</a> · <a href="saas-dashboard.html">Dashboard</a></p>
    <h1>Real business voice</h1>
    <p style="color:var(--muted)">Customer service, sales, reception, ops — multi-personality, local intent routing (swap in LLM later).</p>
    <div class="card">
      <label>Business mode
        <select id="mode"></select>
      </label>
      <div style="margin-top:12px">
        <button type="button" id="mic">🎙 Talk</button>
        <button type="button" id="greet" style="background:transparent;border:1px solid var(--line);color:var(--fg);margin-left:8px">Greet</button>
      </div>
      <div id="log"></div>
    </div>
  </div>
  <script src="src/stt.js"></script>
  <script src="src/tts.js"></script>
  <script src="src/personalities.js"></script>
  <script src="src/business.js"></script>
  <script src="src/agent.js"></script>
  <script>
    const mode = document.getElementById('mode');
    const log = document.getElementById('log');
    PocketVoiceBusiness.listModes().forEach(m => {
      const o = document.createElement('option');
      o.value = m.id; o.textContent = m.label;
      mode.appendChild(o);
    });
    function add(role, t) {
      log.innerHTML += '<div><b style="color:'+(role==='you'?'#7dd3fc':'#86efac')+'">'+role+'</b>: '+t+'</div>';
    }
    const agent = PocketVoiceAgent.create({
      businessMode: 'customer_service',
      personality: 'support',
      onTranscript: (t, who) => add(who === 'user' ? 'you' : 'agent', t),
      onMicState: (on) => {
        const b = document.getElementById('mic');
        b.className = on ? 'hot' : '';
        b.textContent = on ? '🎙 Listening…' : '🎙 Talk';
      },
    });
    mode.onchange = () => agent.setBusinessMode(mode.value);
    document.getElementById('mic').onclick = () => agent.toggle();
    document.getElementById('greet').onclick = () => agent.greet();
  </script>
</body>
</html>

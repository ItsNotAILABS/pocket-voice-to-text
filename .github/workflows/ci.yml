name: Pocket Voice Corpus CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Install
        run: npm install --ignore-scripts
      - name: Syntax
        run: node --check src/voice-state.js && node --check src/node-entry.js
      - name: Test
        run: npm test
      - name: Corpus voice-state gate
        run: |
          node - <<'NODE'
          const p = require('./src/node-entry');
          if (!/^1\.3\./.test(p.version)) process.exit(1);
          if (p.VOICE_STATE_SCHEMA !== 'pocket.voice-state.v1') process.exit(1);
          const state = p.createVoiceState({
            session_id: 'ci-session',
            principal: {principal_id:'ci-user',principal_type:'human',tenant_id:'ci-org'},
            consent: {state:'session',capture:true,transcribe:true,synthesize:true},
            observed_at: '2026-08-24T00:00:00Z'
          });
          if (p.validateVoiceState(state).length) process.exit(1);
          console.log(p.product, p.version, p.VOICE_STATE_SCHEMA, state.state_sha256);
          NODE
      - name: Package dry run
        run: npm pack --dry-run

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Pocket Voice">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10a37f"/>
      <stop offset="100%" stop-color="#0a7a5f"/>
    </linearGradient>
    <linearGradient id="wave" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6ee7b7"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
  </defs>
  <!-- rounded tile -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#g)"/>
  <!-- mic body -->
  <rect x="54" y="32" width="20" height="36" rx="10" fill="#041" opacity="0.9"/>
  <!-- mic stand arc -->
  <path d="M42 58c0 12 10 22 22 22s22-10 22-22" fill="none" stroke="#041" stroke-width="5" stroke-linecap="round" opacity="0.85"/>
  <line x1="64" y1="80" x2="64" y2="92" stroke="#041" stroke-width="5" stroke-linecap="round" opacity="0.85"/>
  <line x1="50" y1="92" x2="78" y2="92" stroke="#041" stroke-width="5" stroke-linecap="round" opacity="0.85"/>
  <!-- sound waves -->
  <path d="M88 48c6 4 6 20 0 24" fill="none" stroke="url(#wave)" stroke-width="4" stroke-linecap="round" opacity="0.95"/>
  <path d="M98 42c10 8 10 28 0 36" fill="none" stroke="url(#wave)" stroke-width="3.5" stroke-linecap="round" opacity="0.7"/>
</svg>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Pocket Voice — Sovereign Terminal</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#0d1117;--bg2:#161b22;--border:#30363d;
    --green:#3fb950;--cyan:#79c0ff;--yellow:#e3b341;
    --red:#f85149;--dim:#8b949e;--white:#e6edf3;
    --prompt-green:#3fb950;--prompt-cyan:#56d364;
  }
  body{background:var(--bg);color:var(--white);font-family:'Courier New',monospace;font-size:14px;min-height:100vh;display:flex;flex-direction:column}
  header{background:var(--bg2);border-bottom:1px solid var(--border);padding:12px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  .logo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:16px;color:var(--green)}
  .logo svg{width:24px;height:24px}
  .tagline{color:var(--dim);font-size:12px}
  .badges{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto}
  .badge{background:var(--bg);border:1px solid var(--border);border-radius:4px;padding:4px 10px;font-size:11px;color:var(--dim);text-decoration:none;cursor:pointer;transition:border-color .2s}
  .badge:hover{border-color:var(--green);color:var(--green)}
  .badge.active{border-color:var(--green);color:var(--green)}
  nav{background:var(--bg2);border-bottom:1px solid var(--border);padding:6px 20px;display:flex;gap:12px;flex-wrap:wrap}
  .nav-link{color:var(--dim);text-decoration:none;font-size:12px;padding:4px 8px;border-radius:4px;transition:background .2s}
  .nav-link:hover,.nav-link.active{background:var(--border);color:var(--white)}
  main{flex:1;display:grid;grid-template-columns:260px 1fr;gap:0}
  aside{background:var(--bg2);border-right:1px solid var(--border);padding:16px;overflow-y:auto;max-height:calc(100vh - 120px)}
  aside h3{font-size:11px;text-transform:uppercase;color:var(--dim);letter-spacing:.08em;margin-bottom:8px}
  .cmd-group{margin-bottom:18px}
  .cmd-btn{display:block;width:100%;text-align:left;background:none;border:1px solid transparent;border-radius:6px;padding:6px 10px;color:var(--white);cursor:pointer;font-size:12px;font-family:inherit;line-height:1.5;transition:all .15s}
  .cmd-btn:hover{border-color:var(--border);background:var(--bg)}
  .cmd-btn .cmd-name{color:var(--cyan);font-size:11px}
  .cmd-btn .cmd-desc{color:var(--dim);font-size:10px;margin-top:2px}
  .terminal-wrap{display:flex;flex-direction:column;height:calc(100vh - 120px)}
  .terminal-output{flex:1;overflow-y:auto;padding:16px 20px;line-height:1.7}
  .line{display:flex;gap:8px;margin-bottom:2px;word-break:break-all}
  .line.cmd .prompt{color:var(--prompt-green);flex-shrink:0}
  .line.cmd .text{color:var(--white)}
  .line.out .text{color:var(--dim)}
  .line.ok .text{color:var(--white)}
  .line.err .text{color:var(--red)}
  .line.info .text{color:var(--yellow)}
  .line.banner .text{color:var(--green);white-space:pre}
  .line.json .text{color:var(--white)}
  .json-key{color:var(--cyan)}
  .json-str{color:var(--green)}
  .json-num{color:var(--yellow)}
  .json-bool{color:var(--red)}
  .json-null{color:var(--dim)}
  .input-row{border-top:1px solid var(--border);padding:10px 20px;display:flex;align-items:center;gap:8px;background:var(--bg)}
  .input-prompt{color:var(--prompt-green);flex-shrink:0;font-size:14px;user-select:none}
  #cmd-input{flex:1;background:none;border:none;color:var(--white);font-family:inherit;font-size:14px;outline:none;caret-color:var(--green)}
  #cmd-input::placeholder{color:var(--dim)}
  .api-url-row{padding:8px 20px;background:var(--bg2);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;font-size:11px}
  .api-url-row label{color:var(--dim)}
  #api-url{background:var(--bg);border:1px solid var(--border);border-radius:4px;padding:3px 8px;color:var(--white);font-family:inherit;font-size:11px;width:260px}
  .status-dot{width:8px;height:8px;border-radius:50%;background:var(--dim);flex-shrink:0}
  .status-dot.online{background:var(--green)}
  .status-dot.offline{background:var(--red)}
  #status-label{color:var(--dim);font-size:11px}
  @media(max-width:680px){main{grid-template-columns:1fr}aside{display:none}}
</style>
</head>
<body>

<header>
  <div class="logo">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
      <path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/>
    </svg>
    Sovereign Terminal
  </div>
  <span class="tagline">Pocket Voice API · Live interactive shell</span>
  <div class="badges">
    <a class="badge" href="index.html">STT</a>
    <a class="badge" href="demo-patient.html">Patient</a>
    <a class="badge" href="demo-voice-agent.html">Agent</a>
    <a class="badge" href="demo-business.html">Business</a>
    <a class="badge" href="demo-coding.html">Coding</a>
    <a class="badge" href="saas-dashboard.html">Dashboard</a>
  </div>
</header>

<nav>
  <span class="nav-link active">terminal</span>
  <span class="nav-link" style="color:var(--dim)">type a command or click a preset →</span>
</nav>

<div class="api-url-row">
  <div class="status-dot" id="status-dot"></div>
  <span id="status-label">connecting…</span>
  <label>API:</label>
  <input id="api-url" value="" placeholder="http://localhost:8790"/>
  <button class="badge" onclick="checkHealth()">ping</button>
</div>

<main>
  <aside>
    <div class="cmd-group">
      <h3>Core</h3>
      <button class="cmd-btn" onclick="run('GET /v1')"><span class="cmd-name">GET /v1</span><div class="cmd-desc">API catalog</div></button>
      <button class="cmd-btn" onclick="run('GET /health')"><span class="cmd-name">GET /health</span><div class="cmd-desc">Liveness check</div></button>
      <button class="cmd-btn" onclick="run('GET /v1/products')"><span class="cmd-name">GET /v1/products</span><div class="cmd-desc">Pricing tiers</div></button>
      <button class="cmd-btn" onclick="run('GET /v1/tiers')"><span class="cmd-name">GET /v1/tiers</span><div class="cmd-desc">SaaS tiers (SAAS_MODE)</div></button>
    </div>
    <div class="cmd-group">
      <h3>Turn / VAD</h3>
      <button class="cmd-btn" onclick='run("POST /v1/turn {\"text\":\"I need help with my flight\",\"scenario\":\"patient\",\"expert\":\"airport_guide\"}")'><span class="cmd-name">POST /v1/turn</span><div class="cmd-desc">Patient travel turn</div></button>
      <button class="cmd-btn" onclick='run("POST /v1/turn/decide {\"transcript\":\"my flight is\",\"silence_ms\":900,\"scenario\":\"patient\"}")'><span class="cmd-name">POST /v1/turn/decide</span><div class="cmd-desc">Hybrid end-of-turn</div></button>
      <button class="cmd-btn" onclick='run("POST /v1/barge-in {\"sensitivity\":\"medium\",\"energy\":0.6,\"speech_active\":true}")'><span class="cmd-name">POST /v1/barge-in</span><div class="cmd-desc">Barge-in decision</div></button>
    </div>
    <div class="cmd-group">
      <h3>STT</h3>
      <button class="cmd-btn" onclick="run('GET /v1/stt/engines')"><span class="cmd-name">GET /v1/stt/engines</span><div class="cmd-desc">Available STT engines</div></button>
      <button class="cmd-btn" onclick='run("POST /v1/stt/transcribe {\"text\":\"When is check-in?\",\"engine\":\"hybrid\",\"is_final\":true}")'><span class="cmd-name">POST /v1/stt/transcribe</span><div class="cmd-desc">Own STT scaffold</div></button>
    </div>
    <div class="cmd-group">
      <h3>Personalities & Modes</h3>
      <button class="cmd-btn" onclick="run('GET /v1/personalities')"><span class="cmd-name">GET /v1/personalities</span><div class="cmd-desc">Available personas</div></button>
      <button class="cmd-btn" onclick="run('GET /v1/modes')"><span class="cmd-name">GET /v1/modes</span><div class="cmd-desc">Business modes</div></button>
      <button class="cmd-btn" onclick="run('GET /v1/experts')"><span class="cmd-name">GET /v1/experts</span><div class="cmd-desc">Context experts</div></button>
      <button class="cmd-btn" onclick="run('GET /v1/scenarios')"><span class="cmd-name">GET /v1/scenarios</span><div class="cmd-desc">VAD scenarios</div></button>
    </div>
    <div class="cmd-group">
      <h3>Agentic Flows</h3>
      <button class="cmd-btn" onclick="run('GET /v1/flows')"><span class="cmd-name">GET /v1/flows</span><div class="cmd-desc">Available flows</div></button>
      <button class="cmd-btn" onclick='run("POST /v1/flows/advance {\"text\":\"my flight is delayed and I need a hotel\"}")'><span class="cmd-name">POST /v1/flows/advance</span><div class="cmd-desc">Travel recovery flow</div></button>
    </div>
    <div class="cmd-group">
      <h3>Context & Sessions</h3>
      <button class="cmd-btn" onclick='run("POST /v1/context {\"domain\":\"hotel\",\"key\":\"check_in\",\"value\":\"4:00 pm\"}")'><span class="cmd-name">POST /v1/context</span><div class="cmd-desc">Store context fact</div></button>
      <button class="cmd-btn" onclick='run("POST /v1/session {\"scenario\":\"patient\",\"expert\":\"hotel_host\"}")'><span class="cmd-name">POST /v1/session</span><div class="cmd-desc">Create session</div></button>
      <button class="cmd-btn" onclick='run("POST /v1/greet {\"scenario\":\"patient\",\"expert\":\"hotel_host\"}")'><span class="cmd-name">POST /v1/greet</span><div class="cmd-desc">Greeting</div></button>
    </div>
    <div class="cmd-group">
      <h3>Coding</h3>
      <button class="cmd-btn" onclick="run('GET /v1/commands')"><span class="cmd-name">GET /v1/commands</span><div class="cmd-desc">Voice coding commands</div></button>
      <button class="cmd-btn" onclick='run("POST /v1/coding/parse {\"text\":\"open file main.js\"}")'><span class="cmd-name">POST /v1/coding/parse</span><div class="cmd-desc">Parse coding utterance</div></button>
    </div>
    <div class="cmd-group">
      <h3>SaaS</h3>
      <button class="cmd-btn" onclick='run("POST /v1/saas/checkout {\"tier\":\"free\",\"email\":\"demo@example.com\"}")'><span class="cmd-name">POST /v1/saas/checkout</span><div class="cmd-desc">Provision free tier</div></button>
      <button class="cmd-btn" onclick="run('GET /v1/admin/tenants')"><span class="cmd-name">GET /v1/admin/tenants</span><div class="cmd-desc">List tenants (admin)</div></button>
      <button class="cmd-btn" onclick="run('GET /v1/admin/usage')"><span class="cmd-name">GET /v1/admin/usage</span><div class="cmd-desc">Usage stats (admin)</div></button>
    </div>
    <div class="cmd-group">
      <h3>Fusion</h3>
      <button class="cmd-btn" onclick='run("POST /v1/fusion/metadata {\"text\":\"check in at 4pm\",\"scenario\":\"patient\",\"expert\":\"hotel_host\"}")'><span class="cmd-name">POST /v1/fusion/metadata</span><div class="cmd-desc">POCKET fusion vector</div></button>
    </div>
  </aside>

  <div class="terminal-wrap">
    <div class="terminal-output" id="output"></div>
    <div class="input-row">
      <span class="input-prompt">❯</span>
      <input id="cmd-input" placeholder='GET /v1  or  POST /v1/turn {"text":"hello"}  or  help' autocomplete="off" spellcheck="false"/>
    </div>
  </div>
</main>

<script>
(function(){
'use strict';

const out = document.getElementById('output');
const inp = document.getElementById('cmd-input');
const apiUrlEl = document.getElementById('api-url');
const dot = document.getElementById('status-dot');
const statusLbl = document.getElementById('status-label');
const history = [];
let histIdx = -1;

// Default API URL — same origin or localhost
apiUrlEl.value = (location.hostname === 'localhost' || location.hostname === '127.0.0.1')
  ? 'http://localhost:8790'
  : (location.origin + (location.port ? '' : ''));

function apiBase(){ return (apiUrlEl.value || 'http://localhost:8790').replace(/\/+$/,''); }

function line(cls, prompt, text){
  const d = document.createElement('div');
  d.className = 'line ' + cls;
  if(prompt){
    const p = document.createElement('span');
    p.className = 'prompt';
    p.textContent = prompt;
    d.appendChild(p);
  }
  const t = document.createElement('span');
  t.className = 'text';
  if(typeof text === 'string') t.textContent = text;
  else t.innerHTML = text;
  d.appendChild(t);
  out.appendChild(d);
  out.scrollTop = out.scrollHeight;
}

function syntaxJson(obj){
  return JSON.stringify(obj, null, 2)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"([^"]+)":/g,'<span class="json-key">"$1"</span>:')
    .replace(/: "([^"]*)"/g,': <span class="json-str">"$1"</span>')
    .replace(/: (-?\d+\.?\d*)/g,': <span class="json-num">$1</span>')
    .replace(/: (true|false)/g,': <span class="json-bool">$1</span>')
    .replace(/: null/g,': <span class="json-null">null</span>');
}

function banner(){
  line('banner','',
`  ____            _        _     __     __    _
 |  _ \\ ___   ___| | _____| |_   \\ \\   / /__ (_) ___ ___
 | |_) / _ \\ / __| |/ / _ \\ __|   \\ \\ / / _ \\| |/ __/ _ \\
 |  __/ (_) | (__|   <  __/ |_     \\ V / (_) | | (_|  __/
 |_|   \\___/ \\___|_|\\_\\___|\\__|     \\_/ \\___/|_|\\___\\___|

 Sovereign Terminal · Pocket Voice API`);
  line('info','','Type  help  for commands · click presets on the left · ↑↓ history');
  line('out','','');
}

async function doRequest(method, path, body){
  const url = apiBase() + path;
  const t0 = Date.now();
  const opts = { method, headers: { 'Content-Type': 'application/json' } };
  const apiKey = localStorage.getItem('pv_api_key') || '';
  if(apiKey) opts.headers['X-API-Key'] = apiKey;
  if(body && method !== 'GET') opts.body = JSON.stringify(body);
  try{
    const r = await fetch(url, opts);
    const ms = Date.now() - t0;
    const data = await r.json();
    line('out','', `HTTP ${r.status} · ${ms}ms · ${url}`);
    const cls = r.ok ? 'json ok' : 'json err';
    line(cls,'', syntaxJson(data));
  } catch(e){
    line('err','✖ ', 'Fetch failed: ' + e.message + '  (Is the API running? Check the URL above)');
  }
}

function parseCmd(raw){
  raw = raw.trim();
  if(!raw) return null;
  const methods = ['GET','POST','PUT','DELETE','PATCH'];
  for(const m of methods){
    if(raw.startsWith(m+' ')){
      const rest = raw.slice(m.length+1).trim();
      const spaceOrBrace = rest.search(/[\s{]/);
      if(spaceOrBrace === -1) return { method: m, path: rest, body: null };
      const path = rest.slice(0, spaceOrBrace).trim() || rest;
      const bodyStr = rest.slice(spaceOrBrace).trim();
      let body = null;
      if(bodyStr){
        try{ body = JSON.parse(bodyStr); } catch(e){ return { error: 'JSON parse error: ' + e.message }; }
      }
      return { method: m, path, body };
    }
  }
  return { alias: raw };
}

const HELP = `
Commands:
  GET  <path>           — HTTP GET
  POST <path> {…}       — HTTP POST with JSON body
  set-key <pv_…>        — store API key in localStorage
  clear                 — clear terminal
  help                  — this message

Examples:
  GET /v1
  POST /v1/turn {"text":"I need a hotel","scenario":"patient"}
  POST /v1/saas/checkout {"tier":"free","email":"me@example.com"}
  set-key pv_abc123
`.trim();

async function run(cmd){
  if(!cmd || !cmd.trim()) return;
  history.unshift(cmd);
  histIdx = -1;
  line('cmd', '❯ ', cmd);

  const p = parseCmd(cmd);
  if(!p) return;

  if(p.error){ line('err','✖ ', p.error); return; }

  if(p.alias){
    const a = p.alias.toLowerCase();
    if(a === 'help'){ line('out','',HELP); return; }
    if(a === 'clear'){ out.innerHTML = ''; banner(); return; }
    if(a.startsWith('set-key ')){
      const k = p.alias.slice(8).trim();
      if(k){ localStorage.setItem('pv_api_key', k); line('ok','✔ ','API key saved to localStorage'); }
      else { localStorage.removeItem('pv_api_key'); line('ok','✔ ','API key cleared'); }
      return;
    }
    line('err','✖ ', 'Unknown command. Type  help');
    return;
  }

  await doRequest(p.method, p.path, p.body);
}

window.run = run; // exposed for sidebar buttons

inp.addEventListener('keydown', e => {
  if(e.key === 'Enter'){
    e.preventDefault();
    const v = inp.value.trim();
    if(v){ run(v); inp.value = ''; }
    return;
  }
  if(e.key === 'ArrowUp'){
    e.preventDefault();
    histIdx = Math.min(histIdx + 1, history.length - 1);
    inp.value = history[histIdx] || '';
    return;
  }
  if(e.key === 'ArrowDown'){
    e.preventDefault();
    histIdx = Math.max(histIdx - 1, -1);
    inp.value = histIdx >= 0 ? history[histIdx] : '';
    return;
  }
});

async function checkHealth(){
  try{
    const r = await fetch(apiBase() + '/health');
    if(r.ok){
      dot.className = 'status-dot online';
      statusLbl.textContent = 'API online · ' + apiBase();
    } else {
      dot.className = 'status-dot offline';
      statusLbl.textContent = 'API error ' + r.status;
    }
  } catch(e){
    dot.className = 'status-dot offline';
    statusLbl.textContent = 'API offline — start with: npm start';
  }
}
window.checkHealth = checkHealth;

// Boot
banner();
checkHealth();
setInterval(checkHealth, 15000);

// Restore saved key hint
const saved = localStorage.getItem('pv_api_key');
if(saved) line('info','','Saved API key loaded from localStorage (use set-key to change)');
})();
</script>
</body>
</html>
